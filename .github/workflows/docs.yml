name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["release"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore uv cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-release-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-release-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false

      # jax (and its jax[cuda12] variant) is a multi-GB download that the docs
      # build never needs: conf.py's autodoc_mock_imports mocks it out, since
      # Sphinx only reads docstrings, it never actually runs any model code.
      - name: Sync docs dependencies (excluding jax)
        run: >
          uv sync --group docs
          --no-install-package jax
          --no-install-package jaxlib
          --no-install-package jax-cuda12-plugin
          --no-install-package jax-cuda12-pjrt

      - name: Build Sphinx docs
        run: uv run --no-sync sphinx-build -b html docs/source docs/build

      - name: Save uv cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-release-${{ hashFiles('uv.lock') }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
