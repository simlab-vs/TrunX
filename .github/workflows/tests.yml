name: Tests

on:
  push:
  pull_request:
  schedule:
    # Weekly run (Mondays 06:00 UTC) to catch dependency drift.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # R is not available on the runner, so build rpy2 without it. The tests
      # never import rpy2, so an ABI-mode build that is never loaded is enough.
      RPY2_CFFI_MODE: ABI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BLAS for PyTensor
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Restore global uv cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-main-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-main-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Save uv caches
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-main-${{ hashFiles('uv.lock') }}
